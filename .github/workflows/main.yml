name: TARSIM Telegram Rapor Botu (7-24 Bulut)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: tarsim-7-24-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-telegram-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Kütüphaneleri ve Playwright Chromium Tarayıcısını Kur
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Telegram Botunu Çalıştır (5 Saatlik Kesintisiz Döngü)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TZ: Europe/Istanbul
        run: |
          timeout 17500s python telegram_bot.py || true

      - name: Kullanıcı Kilidi ve Normalleri Kaydet ve Yeni Döngüyü Başlat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "TARSIM Rapor Bot"
          git config user.email "bot@users.noreply.github.com"
          git add ".owner_lock.sha256" "templates/mevsim_normalleri.xlsx" || true
          git diff --staged --quiet || (git commit -m "Otomatik senkronizasyon" && git pull --rebase origin main && git push origin main) || true
          gh workflow run main.yml || true
